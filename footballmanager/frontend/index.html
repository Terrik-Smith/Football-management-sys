<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Football Manager</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="dashboard">

        <h1>🏈 Football Manager</h1>

        <p class="subtitle">
            NFL Team Management System
        </p>


        <div class="stats-container">

            <div class="stat-card">

                <h2 id="teamCount">Loading...</h2>

                <p>NFL Teams</p>

            </div>


            <div class="stat-card">

                <h2 id="playerCount">Loading...</h2>

                <p>Players</p>

            </div>

        </div>


        <div class="navigation">

            <a href="teams.html">

                <button>
                    🏈 View NFL Teams
                </button>

            </a>


            <a href="allplayers.html">

                <button>
                    👤 Search All Players
                </button>

            </a>

        </div>


        <div class="quick-stats">

            <h2>Quick Stats</h2>

            <p>
                Teams:
                <strong id="teamTotal">Loading...</strong>
            </p>

            <p>
                Players:
                <strong id="playerTotal">Loading...</strong>
            </p>

        </div>

    </div>


    <script src="index.js"></script>

</body>

</html>
